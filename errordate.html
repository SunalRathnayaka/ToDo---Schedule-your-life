<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #fff; /* White background */
            color: #000; /* Black font color */
            text-align: center;
            font-family: 'Arial', sans-serif; /* Elegant font */
            margin: 0;
            padding: 0;
        }
        h1 {
            font-size: 2em;
            margin-top: 20px;
        }
        p {
            font-size: 1.2em;
            margin: 20px 0;
        }
        button {
            background-color: #000; /* Black background for button */
            color: #fff; /* White font color for button */
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #444; /* Darker shade on hover */
        }
    </style>
</head>
<body>
    <h1>Error</h1>
    <p>Can't Schedule task for the Past!</p>
    <button onclick="back()">Got it</button>
    <script>
        function back(){
            window.close();
        }
    </script>
</body>
</html>
